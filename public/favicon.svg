<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
  <!-- Pastry / Croissant Graphic -->
  <g transform="translate(16, 20) scale(1.0)">
    <!-- Main Croissant body -->
    <path d="M 48 10 C 66 10, 84 24, 88 44 C 90 54, 85 64, 76 72 C 68 79, 58 82, 48 82 C 38 82, 28 79, 20 72 C 11 64, 6 54, 8 44 C 12 24, 30 10, 48 10 Z" fill="#fef3c7" stroke="#78350f" stroke-width="3" />
    <!-- Outer golden crust layers -->
    <path d="M 22 70 C 14 62, 10 50, 12 40 C 16 22, 32 14, 48 14 C 64 14, 80 22, 84 40 C 86 50, 82 62, 74 70 C 66 60, 62 42, 48 42 C 34 42, 30 60, 22 70 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2.5" />
    <!-- Segment rings -->
    <path d="M 36 22 C 32 38, 32 54, 38 66" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 60 22 C 64 38, 64 54, 58 66" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 48 14 C 48 30, 48 50, 48 70" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <!-- Warm shine highlight -->
    <path d="M 28 32 C 34 22, 44 18, 56 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
